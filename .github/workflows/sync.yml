name: Sync stats

on:
  schedule:
    - cron: "17 * * * *" # hourly; GitHub may run it a few minutes late
  workflow_dispatch: # the site's "Sync now" button

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - run: python3 app/sync.py data
      - name: Commit stats.json if it changed
        working-directory: data
        run: |
          git config user.name "prep-log-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet && exit 0
          git commit -m "Sync stats"
          for i in 1 2 3; do
            git pull --rebase origin data && git push origin HEAD:data && exit 0
            sleep 5
          done
          exit 1
